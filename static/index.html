<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-robot"></i> Voice AI Assistant</h1>
            <p class="subtitle">Real-time voice conversation with AI</p>
        </header>

        <div class="status-bar">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">Ready to connect</span>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>
        </div>

        <div class="controls">
            <div class="voice-controls">
                <button id="micButton" class="mic-button">
                    <i class="fas fa-microphone"></i>
                    <span>Start Speaking</span>
                </button>
                
                <div class="voice-visualizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <div class="transcript-display">
                <div class="transcript-label">Your Speech:</div>
                <div class="transcript" id="transcript"></div>
            </div>

            <div class="audio-controls">
                <button id="playButton" class="play-button" disabled>
                    <i class="fas fa-play"></i>
                    <span>Play Response</span>
                </button>
                
                <div class="volume-control">
                    <i class="fas fa-volume-up"></i>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
                </div>
            </div>
        </div>

        <div class="connection-info">
            <div class="info-item">
                <i class="fas fa-plug"></i>
                <span>WebSocket: <span id="wsStatus">Disconnected</span></span>
            </div>
            <div class="info-item">
                <i class="fas fa-microphone-alt"></i>
                <span>Voice Input: <span id="voiceStatus">Ready</span></span>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
